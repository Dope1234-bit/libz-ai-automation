name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Format
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Audit dependencies
        run: pnpm audit --prod --audit-level high

  database:
    name: Database & integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Start Supabase (applies migrations)
        run: pnpm db:start

      - name: Database tests (pgTAP, row-level security)
        run: pnpm db:test

      - name: Database lint
        run: pnpm db:lint

      - name: API integration tests
        run: |
          # Local-only, well-known development keys printed by the local stack.
          eval "$(pnpm exec supabase status -o json | jq -r '
            "export SUPABASE_URL=\(.API_URL)",
            "export SUPABASE_PUBLISHABLE_KEY=\(.PUBLISHABLE_KEY)",
            "export SUPABASE_SECRET_KEY=\(.SECRET_KEY)"')"
          pnpm test:integration

      - name: Stop Supabase
        if: always()
        run: pnpm db:stop

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
